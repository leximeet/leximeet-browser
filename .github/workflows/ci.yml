name: Browser standalone CI
on:
  push:
    branches: [main]
    # 本仓发布标签与应用版本一致，如 1.0.0，不加 v 前缀。
    tags: ["[0-9]*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-ci-${{ github.workflow }}-${{ github.ref }}
  # 正式发行开始后不取消正在上传的写请求。
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  browser:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: 设置本轮临时公开词包和报告目录
        run: |
          printf 'LEXIMEET_DICTIONARY_RELEASE_DIR=%s/leximeet-dictionary-v0.0.3\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'LEXIMEET_TEST_OUTPUT=%s/browser-standalone\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      # fork PR在一次性runner执行，不继承生产secret，不用pull_request_target。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 核对正式标签对应版本及 main 历史
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(process.env.RELEASE_TAG) || JSON.parse(fs.readFileSync('package.json', 'utf8')).version !== process.env.RELEASE_TAG) throw new Error('正式标签必须是不带 v 的三段版本，并与 package.json 一致');
          JS
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: dictionary-cache
        with:
          path: ${{ env.LEXIMEET_DICTIONARY_RELEASE_DIR }}
          key: dictionary-v0.0.3-text-${{ hashFiles('dictionary-text.lock.json') }}
      - name: 获取并核验固定Lite与Core公开词包
        run: npm run fetch:dictionary -- --with-core
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: steps.dictionary-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.LEXIMEET_DICTIONARY_RELEASE_DIR }}
          key: dictionary-v0.0.3-text-${{ hashFiles('dictionary-text.lock.json') }}
      - run: npx playwright install chromium
      - name: 格式、文档、合同、类型与完整单元
        run: npm run format:check && npm run docs:check && npm run verify:connector && npm run typecheck && npm test
      - name: 构建 Chrome 与 Edge 安装包并校验相同生产字节
        run: |
          npm run zip
          npm run zip:edge
          npm run verify:manifest
          npm run verify:manifest:edge
          npm run verify:store-packages
      # 完整套件使用刚才的原样 Chrome 生产目录；两端字节相同不冒称正式 Edge 实测。
      - name: 完整独立 Chromium 无头 UI
        run: npm run test:browser
      - name: 确认测试后 ZIP 与生产字节仍然一致
        run: npm run verify:store-packages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-store-packages
          path: |
            .output/leximeet-browser-*-chrome.zip
            .output/leximeet-browser-*-edge.zip
            .output/store-packages.json
            .output/SHA256SUMS
          # .output 是隐藏目录；仅放行上述经过校验的四个文件，不上传整个目录。
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: browser-standalone-macos-arm64
          path: |
            ${{ env.LEXIMEET_TEST_OUTPUT }}
          retention-days: 14

  connected:
    name: 验收正式标签与固定 Desktop/Core 的真实连接
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: browser
    # 这组固定提交已在真实连接 CI 验收通过；升级 Desktop 时同时核验其 Core gitlink。
    uses: ./.github/workflows/connected.yml
    with:
      desktop_ref: 204dc05d6c17143afd080066bfcb31f9a31006cc
      core_ref: d1bbb7777ff164e861a4a65f654a990afaf0939f

  release:
    name: Publish tested Chrome and Edge packages
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [browser, connected]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: browser-store-packages
          path: .output/tested-packages/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: browser-connected-store-evidence
          path: .output/connected-evidence/
      - name: 核对同一源码的独立和连接生产内容
        run: node scripts/verify-connected-release.mjs .output/tested-packages/store-packages.json .output/connected-evidence/store-packages.json "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: 核对原样安装包并归档完整对应源码
        run: node scripts/package-github-release.mjs .output/tested-packages .output/github-release .output/connected-evidence/store-packages.json
      - name: 完整附件上传后公开正式 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" .output/github-release/* --verify-tag --draft --title "LexiMeet Browser $GITHUB_REF_NAME" --notes-file "docs/版本/$GITHUB_REF_NAME.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

  stores:
    name: 自动提交 ${{ matrix.store }} 商店审核
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [browser, connected, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        store: [chrome, edge]
    environment: ${{ matrix.store }}-store
    concurrency:
      group: ${{ matrix.store }}-store
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: browser-store-packages
          path: .output/tested-packages/
      # 发布阶段不安装依赖、不重新构建，凭据只交给对应平台的最后一步。
      - name: 核对 Chrome 当前版本仍是最新正式发行
        if: matrix.store == 'chrome'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/chrome-releases.json"
          node scripts/verify-latest-store-release.mjs "$RUNNER_TEMP/chrome-releases.json" "$GITHUB_REF_NAME"
      - name: Chrome V2 上传并提交审核
        if: matrix.store == 'chrome'
        env:
          CHROME_SERVICE_ACCOUNT_JSON: ${{ secrets.CHROME_SERVICE_ACCOUNT_JSON }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_REPLACE_PENDING_REVIEW: "1"
        run: node scripts/publish-stores.mjs chrome .output/tested-packages
      - name: Edge v1.1 上传并提交审核
        if: matrix.store == 'edge'
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
        run: node scripts/publish-stores.mjs edge .output/tested-packages
