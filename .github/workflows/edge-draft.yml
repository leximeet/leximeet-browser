name: Upload or resume Edge package
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "成功的 main 独立 CI run ID（不是 URL）"
        required: true
        type: string
      connected_run_id:
        description: "同一源码通过真实 Desktop 连接的 run ID"
        required: true
        type: string
      source_sha:
        description: "该 CI 验证的完整 40 位源码提交 SHA"
        required: true
        type: string
      published_product:
        description: "此产品已在 Edge 首次发布；允许更新其版本"
        required: true
        default: false
        type: boolean
      upload_operation_id:
        description: "已受理上传的操作 ID；填写后只续查该操作，不重新上传"
        required: false
        type: string
      submit_for_review:
        description: "包处理成功后提交正常审核；默认只更新草稿"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: edge-store
  cancel-in-progress: false
jobs:
  upload:
    if: github.ref == 'refs/heads/main' && inputs.published_product
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: edge-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: 下载同仓 main 成功 CI 的已验收产物
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CONNECTED_RUN_ID: ${{ inputs.connected_run_id }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          node --input-type=module <<'JS'
          if (![process.env.CI_RUN_ID, process.env.CONNECTED_RUN_ID].every((value) => /^[1-9][0-9]*$/.test(value)) || !/^[0-9a-f]{40}$/.test(process.env.EXPECTED_SHA)) throw new Error('请输入 run ID 与完整源码 SHA');
          JS
          gh api "repos/$GH_REPO/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/edge-source-run.json"
          gh api "repos/$GH_REPO/actions/runs/$CONNECTED_RUN_ID" > "$RUNNER_TEMP/edge-connected-run.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          for (const [file, id, path, events] of [
            ['edge-source-run.json', process.env.CI_RUN_ID, '.github/workflows/ci.yml', ['push', 'workflow_dispatch']],
            ['edge-connected-run.json', process.env.CONNECTED_RUN_ID, '.github/workflows/connected.yml', ['workflow_dispatch']],
          ]) {
            const run = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/${file}`, 'utf8'));
            if (String(run.id) !== id || run.path !== path || run.status !== 'completed' || run.conclusion !== 'success' || !events.includes(run.event) || run.head_branch !== 'main' || run.head_sha !== process.env.EXPECTED_SHA || run.head_repository?.full_name !== process.env.GH_REPO || run.repository?.full_name !== process.env.GH_REPO) throw new Error('要求本仓 main 同一源码的独立与连接 CI 均通过；不接收 PR、标签或其他工作流产物');
          }
          JS
          gh run download "$CI_RUN_ID" --repo "$GH_REPO" --name browser-store-packages --dir "$RUNNER_TEMP/edge-store-packages"
      - name: 核验来源与安装包摘要
        id: package
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const directory = `${process.env.RUNNER_TEMP}/edge-store-packages`;
          const source = JSON.parse(fs.readFileSync(`${directory}/store-packages.json`, 'utf8'));
          // 字段与 verify:store-packages 同源；不执行下载产物中的任何脚本。
          if (source.sourceCommit !== process.env.EXPECTED_SHA || source.sourceDirty !== false || source.equivalence !== true) throw new Error('产物未绑定到干净源码与等价生产包');
          const edge = source.packages?.edge;
          if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(source.version) || edge?.file !== `leximeet-browser-${source.version}-edge.zip` || !/^[0-9a-f]{64}$/.test(edge.sha256)) throw new Error('Edge 产物声明无效');
          const file = `${directory}/${edge.file}`;
          const bytes = fs.readFileSync(file);
          if (bytes.length !== edge.bytes || crypto.createHash('sha256').update(bytes).digest('hex') !== edge.sha256) throw new Error('Edge 安装包摘要或大小不同');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `path=${file}\nsha256=${edge.sha256}\nversion=${source.version}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `来源提交：${source.sourceCommit}\n\nEdge ZIP：${edge.file}\n\nSHA-256：${edge.sha256}\n\n`);
          JS
      # 仅此步骤读取商店密钥；续查已受理操作，显式勾选才提交审核。
      - name: 上传或续查 Edge 包，按选择提交审核
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          PACKAGE_SHA256: ${{ steps.package.outputs.sha256 }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          EDGE_UPLOAD_OPERATION_ID: ${{ inputs.upload_operation_id }}
          SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {uploadEdgeDraft} from './scripts/upload-edge-draft.mjs';
          import {publishEdge} from './scripts/publish-stores.mjs';
          const options = {
            packagePath:process.env.PACKAGE_PATH, expectedSha256:process.env.PACKAGE_SHA256,
            productId:process.env.EDGE_PRODUCT_ID, clientId:process.env.EDGE_CLIENT_ID, apiKey:process.env.EDGE_API_KEY,
            resumeUploadOperationId:process.env.EDGE_UPLOAD_OPERATION_ID || undefined,
          };
          const submit = process.env.SUBMIT_FOR_REVIEW === 'true';
          const result = submit
            ? await publishEdge({...options, version:process.env.PACKAGE_VERSION, notes:fs.readFileSync('scripts/store-certification-notes.txt','utf8')})
            : await uploadEdgeDraft(options);
          const summary = submit
            ? `Edge ${process.env.PACKAGE_VERSION}: ${result.state}；最终上架由商店审核决定。`
            : `Edge 草稿包处理成功：${result.operationId}。尚未提交审核。`;
          console.log(summary);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          JS
